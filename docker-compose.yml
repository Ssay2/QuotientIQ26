version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: quotientiq-db
    environment:
      POSTGRES_USER: quotientiq
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: quotientiq_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quotientiq"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: quotientiq-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: quotientiq-api
    working_dir: /app/apps/api
    command: npm run dev
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://quotientiq:dev_password@postgres:5432/quotientiq_dev
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/shared/src:/app/packages/shared/src
    networks:
      - quotientiq-network

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: quotientiq-web
    working_dir: /app/apps/web
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://api:4000
    depends_on:
      - api
    volumes:
      - ./apps/web/app:/app/apps/web/app
      - ./apps/web/components:/app/apps/web/components
      - ./apps/web/lib:/app/apps/web/lib
      - ./packages/shared/src:/app/packages/shared/src
    networks:
      - quotientiq-network

volumes:
  postgres_data:
  redis_data:

networks:
  quotientiq-network:
    driver: bridge
